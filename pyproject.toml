[project]
name = "shotsieve"
version = "0.1.0"
description = "Private, offline AI photo culling for macOS: no cloud, no subscription"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The ShotSieve Authors" }]
keywords = ["photography", "culling", "raw", "lightroom", "offline", "onnx"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy",
  "opencv-contrib-python",
  "mediapipe",
  "onnxruntime",
  "rawpy",
  "pillow",
  "pillow-heif",
  "exifread",
  "piexif",
  "scikit-learn",
  "joblib",
  "fastapi",
  "uvicorn",
  "httpx",
  "python-multipart",
  "psutil",
  "tomli-w",
  "tokenizers>=0.23.3",
  "sqlite-vec>=0.1.9",
  "pywebview>=6.2.1",
]

[project.urls]
Homepage = "https://github.com/SiranjeviKrishnan/shotsieve"
Repository = "https://github.com/SiranjeviKrishnan/shotsieve"
Issues = "https://github.com/SiranjeviKrishnan/shotsieve/issues"
Changelog = "https://github.com/SiranjeviKrishnan/shotsieve/releases"

[dependency-groups]
dev = [
    "defusedxml>=0.7.1",
    "playwright>=1.64.1",
    "pytest",
    "ruff",
]

[project.scripts]
shotsieve = "shotsieve.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shotsieve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
pythonpath = ["src"]
markers = [
  "models: requires downloaded model files",
  "network: requires network access",
  "large: 10k-frame synthetic shoot tests (model-free, T21)",
  "install: sandbox install / launcher tests (skipped unless -m install)",
  "ui: real-browser tests (Playwright + Chromium; skipped when Chromium is missing)",
  "release: builds/tests the relocatable ShotSieve.app + .dmg (skipped unless dist/ exists)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = [
  "data", "docs/provenance", ".uv-cache", ".pytest_tmp", ".pytest_tmp_*", ".playwright", ".uv-python",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
